<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Color</title>
<meta name="theme-color" id="themeColor" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Color">
<style>
  :root {
    --color: #fff;
    --fg: #000;                            /* all four are recomputed on every */
    --muted: #737373;                      /* change: each is the inverse of   */
    --panel-bg: #e6e6e6;                   /* the page colour, mixed back      */
    --panel-border: #bfbfbf;               /* toward it by a fixed amount      */
    --fill-bg: #cccccc;                    /* the filled part of a slider      */
    --item-h: 44px;
    --panel-h: calc(var(--item-h) * 4 + 5px);   /* four rows, the 2px border, the divider */
    --t-lg: 44px;
    --t-sm: 18px;
  }

  @media (prefers-color-scheme: dark) {
    :root { --color: #000; }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html {
    background-color: var(--color);   /* covers the overscroll area only */
  }

  .bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    background-color: var(--color);
  }

  body {
    min-height: 100dvh;
    isolation: isolate;
    color: var(--fg);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 300;
  }

  body {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 28px calc(var(--panel-h) + 160px + env(safe-area-inset-bottom));
  }

  /* ---------- Small text: one rule for every label and value ---------- */

  .label,
  .value,
  .strip-label,
  .strip-value {
    font-size: var(--t-sm);
    font-weight: 300;
    color: var(--muted);
  }

  .value,
  .strip-value { color: var(--fg); font-weight: 400; }

  /* ---------- Swatch ---------- */

  .hex {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(40px + var(--panel-h) + env(safe-area-inset-bottom));
    width: calc(100% - 56px);
    max-width: calc(480px - 56px);
    margin: 0;
    padding: 0;
    color: var(--fg);
  }

  .hex-value {
    min-width: 0;
    flex: 0 1 auto;
    font-family: inherit;
    font-size: var(--t-lg);
    font-weight: 300;
    text-transform: uppercase;
    border: none;
    background: none;
    color: inherit;
    caret-color: currentColor;
    -webkit-appearance: none;
    appearance: none;
  }

  .hex-value:focus { outline: none; }

  .hex-copy {
    flex: 0 0 auto;
    border: none;
    background: none;
    font-family: inherit;
    color: inherit;
    cursor: pointer;
  }

  .hex-copy:active { opacity: 0.4; }

  /* ---------- Value rows ---------- */

  .row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    width: 100%;
    padding: 11px 0;
    border: none;
    border-bottom: 1px solid var(--panel-border);
    background: none;
    font-family: inherit;
    cursor: pointer;
    text-align: left;
  }

  .row:active { opacity: 0.4; }

  #rows {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    align-items: start;
    gap: 36px 40px;
  }

  .dots { display: none; }

  /* above the mobile width the wrappers vanish and the groups
     become grid items again */
  .page { display: contents; }

  @media (max-width: 699px) {
    #rows {
      display: flex;
      gap: 0 28px;
      margin: 0 -28px;
      padding: 0 28px;
      scroll-padding: 0 28px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
    }
    #rows::-webkit-scrollbar { display: none; }

    /* one full-width page per pair, the two groups stacked inside it */
    .page {
      display: block;
      flex: 0 0 calc(100% - 56px);
      scroll-snap-align: start;
    }

    .page .section + .section { margin-top: 36px; }

    .dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 24px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
    }

    .dot.on { background: var(--fg); }
  }

  .section-label {
    display: block;
    padding-bottom: 6px;
    font-size: var(--t-sm);
    font-weight: 300;
    color: var(--muted);
  }

  .value {
    flex: 0 1 auto;
    min-width: 0;
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* the label never gets squeezed by a long value */
  .row .label { flex: 0 0 auto; }

  /* ---------- Fixed input panel ---------- */

  .panel {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(20px + env(safe-area-inset-bottom));
    width: calc(100% - 56px);
    max-width: calc(480px - 56px);
    background: var(--panel-bg);
    border: 2px solid var(--panel-border);
    border-radius: 20px;
    overflow: hidden;
  }

  .modes {
    display: flex;
    align-items: center;
    gap: 20px;
    height: var(--item-h);
    padding: 0 16px;
    border-bottom: 1px solid var(--panel-border);
  }

  .mode {
    padding: 0;
    border: none;
    background: none;
    font-family: inherit;
    font-size: var(--t-sm);
    font-weight: 300;
    color: var(--muted);
    cursor: pointer;
  }

  .mode.on { color: var(--fg); font-weight: 400; }
  .mode[hidden] { display: none; }

  /* pushed right, so invert sits beyond it when it is showing */
  .mode.swap {
    margin-left: auto;
    display: flex;
    align-items: center;
    color: var(--fg);
  }

  .mode.swap svg { display: block; }
  .mode.swap:active { opacity: 0.4; }

  .strip-row {
    position: relative;
    height: var(--item-h);
    overflow: hidden;
  }

  /* the input surface: a real scroll container, so momentum, rubber-banding
     and wheel handling all come from the platform rather than from script */
  .scroller {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    overflow-x: hidden;
    touch-action: pan-y;
    overscroll-behavior-y: contain;
    scrollbar-width: none;
    cursor: ns-resize;
  }
  .scroller::-webkit-scrollbar { display: none; }

  .ghost { width: 100%; }

  .strip-row + .strip-row { border-top: 1px solid var(--panel-border); }

  /* the fill and its leading edge are one element: the border is the line */
  .fill {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: 0;
    box-sizing: border-box;
    background: var(--fill-bg);
    border-right: 1px solid var(--fg);
    pointer-events: none;
  }

  .strip-label {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
  }

  .strip-value {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 56px;
    text-align: right;
    border: none;
    background: none;
    font-family: inherit;
    color: inherit;
    caret-color: currentColor;
    -webkit-appearance: none;
    appearance: none;
  }

  .strip-value:focus { outline: none; }
</style>
</head>
<body>

  <div class="bg" id="bg"></div>

  <div class="hex">
    <input class="hex-value" id="hexValue" type="text" spellcheck="false"
           autocapitalize="off" autocorrect="off" enterkeyhint="done" aria-label="hex value">
    <button class="label hex-copy" id="hexBtn" type="button">hex</button>
  </div>

  <div id="rows"></div>

  <div class="dots" id="dots"></div>

  <div class="panel">
    <div class="modes">
      <button class="mode" id="modeBg" type="button">background</button>
      <button class="mode" id="modeText" type="button">text</button>
      <button class="mode swap" id="modeSwap" type="button" aria-label="Swap background and text">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor"
             stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" aria-hidden="true">
          <path d="M14.5 4.5 H1.5 M4.5 2 L1.5 4.5 L4.5 7"/>
          <path d="M1.5 11.5 H14.5 M11.5 14 L14.5 11.5 L11.5 9"/>
        </svg>
      </button>
      <button class="mode invert" id="modeInvert" type="button">invert</button>
    </div>

    <div class="strip-row" id="rowH">
      <div class="fill" id="fillH"></div>
      <div class="scroller" id="scrollH"><div class="ghost"></div></div>
      <span class="strip-label">hue</span>
      <input class="strip-value" id="valH" type="text" inputmode="numeric" enterkeyhint="done" aria-label="hue">
    </div>
    <div class="strip-row" id="rowS">
      <div class="fill" id="fillS"></div>
      <div class="scroller" id="scrollS"><div class="ghost"></div></div>
      <span class="strip-label">saturation</span>
      <input class="strip-value" id="valS" type="text" inputmode="numeric" enterkeyhint="done" aria-label="saturation">
    </div>
    <div class="strip-row" id="rowL">
      <div class="fill" id="fillL"></div>
      <div class="scroller" id="scrollL"><div class="ghost"></div></div>
      <span class="strip-label">lightness</span>
      <input class="strip-value" id="valL" type="text" inputmode="numeric" enterkeyhint="done" aria-label="lightness">
    </div>
  </div>

<script>
  // ---------- colour maths ----------

  function hslToRgb(h, s, l) {
    s /= 100; l /= 100;
    const k = n => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    return [f(0) * 255, f(8) * 255, f(4) * 255].map(v => Math.round(v));
  }

  const hex2 = v => v.toString(16).padStart(2, '0');

  function parseHex(text) {
    const m = String(text).trim().replace(/^#/, '');
    const s = m.length === 3 ? m.split('').map(ch => ch + ch).join('') : m;
    if (!/^[0-9a-fA-F]{6}$/.test(s)) return null;
    return [0, 2, 4].map(i => parseInt(s.slice(i, i + 2), 16));
  }

  function rgbToHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
    const l = (mx + mn) / 2;
    let h = 0, s = 0;
    if (d) {
      s = d / (1 - Math.abs(2 * l - 1));
      if (mx === r) h = ((g - b) / d) % 6;
      else if (mx === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
      if (h < 0) h += 360;
    }
    return [h, s * 100, l * 100];
  }

  function rgbToHsb(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
    let h = 0;
    if (d) {
      if (mx === r) h = ((g - b) / d) % 6;
      else if (mx === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
      if (h < 0) h += 360;
    }
    return [h, mx ? (d / mx) * 100 : 0, mx * 100];
  }

  function rgbToCmyk(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const k = 1 - Math.max(r, g, b);
    if (k === 1) return [0, 0, 0, 100];
    return [
      ((1 - r - k) / (1 - k)) * 100,
      ((1 - g - k) / (1 - k)) * 100,
      ((1 - b - k) / (1 - k)) * 100,
      k * 100
    ];
  }

  const toLinear = c => {
    c /= 255;
    return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  };

  function rgbToLab(r, g, b) {
    const R = toLinear(r), G = toLinear(g), B = toLinear(b);
    const X = (0.4124564 * R + 0.3575761 * G + 0.1804375 * B) / 0.95047;
    const Y = (0.2126729 * R + 0.7151522 * G + 0.0721750 * B) / 1.00000;
    const Z = (0.0193339 * R + 0.1191920 * G + 0.9503041 * B) / 1.08883;
    const f = t => t > 0.008856 ? Math.cbrt(t) : (7.787 * t) + 16 / 116;
    const fx = f(X), fy = f(Y), fz = f(Z);
    return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
  }

  function rgbToOklab(r, g, b) {
    const R = toLinear(r), G = toLinear(g), B = toLinear(b);
    const l = Math.cbrt(0.4122214708 * R + 0.5363325363 * G + 0.0514459929 * B);
    const m = Math.cbrt(0.2119034982 * R + 0.6806995451 * G + 0.1073969566 * B);
    const s = Math.cbrt(0.0883024619 * R + 0.2817188376 * G + 0.6299787005 * B);
    return [
      0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s,
      1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s,
      0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s
    ];
  }

  function toLch(L, a, b) {
    const C = Math.hypot(a, b);
    let H = Math.atan2(b, a) * 180 / Math.PI;
    if (H < 0) H += 360;
    return [L, C, H];
  }

  const r1 = v => Math.round(v);
  const r2 = v => (Math.round(v * 100) / 100).toString();

  // ---------- state ----------

  const inputs = {};
  const syncs = {};
  const RANGES = { h: [0, 360], s: [0, 100], l: [0, 100] };
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  let S = {
    bg:   { h: 0, s: 0, l: prefersDark ? 0 : 100 },   // #000 or #fff on first visit
    text: { h: 0, s: 0, l: prefersDark ? 100 : 0 },
    target: 'bg',                                    // which colour the sliders edit
    auto: true                                       // text is the inverse of the background
  };

  function invHSL(c) {
    const inv = hslToRgb(c.h, c.s, c.l).map(v => 255 - v);
    const [h, s, l] = rgbToHsl(...inv);
    return { h: Math.round(h), s: Math.round(s), l: Math.round(l) };
  }

  const textHSL = () => (S.auto ? invHSL(S.bg) : S.text);
  const active = () => (S.target === 'bg' ? S.bg : textHSL());

  // editing while on text drops out of invert, keeping the colour you were on
  function setActive(key, v) {
    if (S.target === 'bg') { S.bg[key] = v; return; }
    if (S.auto) { S.text = textHSL(); S.auto = false; }
    S.text[key] = v;
  }

  function setActiveHSL(o) {
    if (S.target === 'bg') { S.bg = o; return; }
    S.auto = false;
    S.text = o;
  }

  const SECTIONS = [
    ['screen', [
      ['rgb',   c => `rgb(${c.rgb.join(' ')})`],
      ['hsl',   c => `hsl(${r1(c.h)} ${r1(c.s)}% ${r1(c.l)}%)`],
      ['hsb',   c => `hsb(${r1(c.hsb[0])} ${r1(c.hsb[1])}% ${r1(c.hsb[2])}%)`]
    ]],
    ['print', [
      ['cmyk',  c => c.cmyk.map(r1).join(' ') + ' %']
    ]],
    ['perceptual', [
      ['lab',   c => `lab(${r2(c.lab[0])}% ${r2(c.lab[1])} ${r2(c.lab[2])})`],
      ['lch',   c => `lch(${r2(c.lch[0])}% ${r2(c.lch[1])} ${r2(c.lch[2])})`],
      ['oklch', c => `oklch(${r2(c.oklch[0] * 100)}% ${r2(c.oklch[1])} ${r2(c.oklch[2])})`]
    ]],
    ['code', [
      ['css',   c => `--color: ${c.hex};`],
      ['swift', c => `Color(red: ${r2(c.rgb[0] / 255)}, green: ${r2(c.rgb[1] / 255)}, blue: ${r2(c.rgb[2] / 255)})`]
    ]]
  ];

  const FORMATS = SECTIONS.flatMap(([, items]) => items);

  const rowsEl = document.getElementById('rows');
  const rowEls = [];
  let page = null;
  SECTIONS.forEach(([title, items], si) => {
    if (si % 2 === 0) {
      page = document.createElement('div');
      page.className = 'page';
      rowsEl.appendChild(page);
    }
    const sec = document.createElement('section');
    sec.className = 'section';
    const h = document.createElement('span');
    h.className = 'section-label';
    h.textContent = title;
    sec.appendChild(h);
    items.forEach(([name]) => {
      const b = document.createElement('button');
      b.className = 'row';
      b.type = 'button';
      b.innerHTML = `<span class="label">${name}</span><span class="value"></span>`;
      sec.appendChild(b);
      rowEls.push(b);
    });
    page.appendChild(sec);
  });

  const hexBtn = document.getElementById('hexBtn');
  const hexValue = document.getElementById('hexValue');

  function derive(hsl) {
    const rgb = hslToRgb(hsl.h, hsl.s, hsl.l);
    const hex = '#' + rgb.map(hex2).join('');
    const lab = rgbToLab(...rgb);
    const ok = rgbToOklab(...rgb);
    return {
      ...hsl, rgb, hex,
      hsb: rgbToHsb(...rgb),
      cmyk: rgbToCmyk(...rgb),
      lab,
      lch: toLch(...lab),
      oklch: toLch(...ok)
    };
  }

  function render() {
    const root = document.documentElement;
    const bgC = derive(S.bg);
    const txC = derive(textHSL());

    // every token is a step from the background toward the text colour, so
    // one control drives the type, the rules, the borders and the fills
    const toward = a => `rgb(${bgC.rgb.map((v, i) => Math.round(v + (txC.rgb[i] - v) * a)).join(' ')})`;
    root.style.setProperty('--color', bgC.hex);
    root.style.setProperty('--fg', toward(1));
    root.style.setProperty('--muted', toward(0.55));
    root.style.setProperty('--panel-bg', toward(0.10));
    root.style.setProperty('--fill-bg', toward(0.22));
    root.style.setProperty('--panel-border', toward(0.25));
    root.style.backgroundColor = bgC.hex;
    bg.style.backgroundColor = bgC.hex;
    themeColor.setAttribute('content', bgC.hex);

    modeBg.classList.toggle('on', S.target === 'bg');
    modeText.classList.toggle('on', S.target === 'text');
    modeInvert.hidden = S.target !== 'text';
    modeInvert.classList.toggle('on', S.auto);

    // the readout follows whichever colour is selected
    const c = S.target === 'bg' ? bgC : txC;
    if (!hexValue.dataset.copying && document.activeElement !== hexValue) {
      hexValue.value = c.hex;
    }
    FORMATS.forEach(([, fn], i) => {
      const v = fn(c);
      const el = rowEls[i].querySelector('.value');
      if (!el.dataset.copying) el.textContent = v;
      rowEls[i].dataset.copy = v;
    });
    hexBtn.dataset.copy = c.hex;
    const a = active();
    for (const k of ['h', 's', 'l']) {
      const el = inputs[k];
      if (el && document.activeElement !== el) el.value = r1(a[k]);
      const f = fills[k];
      if (f) {
        const [lo, hi] = RANGES[k];
        f.style.width = ((a[k] - lo) / (hi - lo) * 100) + '%';
      }
    }
    try { localStorage.setItem('color.state', JSON.stringify(S)); } catch (e) {}
  }

  // ---------- copy ----------

  function legacyCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:-100px;opacity:0;';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    ta.remove();
    return ok;
  }

  function copy(btn, slot) {
    const text = btn.dataset.copy;
    const set = v => { if ('value' in slot && slot.tagName === 'INPUT') slot.value = v; else slot.textContent = v; };
    const done = () => {
      slot.dataset.copying = '1';
      set('copied');
      setTimeout(() => { delete slot.dataset.copying; render(); }, 900);
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done).catch(() => { if (legacyCopy(text)) done(); });
    } else if (legacyCopy(text)) {
      done();
    }
  }

  rowEls.forEach(b => b.addEventListener('click', () => copy(b, b.querySelector('.value'))));
  hexBtn.addEventListener('click', () => copy(hexBtn, hexValue));

  // typing or pasting a hex drives the sliders
  function commitHex() {
    const rgb = parseHex(hexValue.value);
    if (rgb) {
      const [h, s, l] = rgbToHsl(...rgb);
      setActiveHSL({ h: Math.round(h), s: Math.round(s), l: Math.round(l) });
      syncAll();
    }
    render();
  }

  hexValue.addEventListener('focus', () => hexValue.select());
  hexValue.addEventListener('change', commitHex);
  hexValue.addEventListener('blur', commitHex);
  hexValue.addEventListener('keydown', e => { if (e.key === 'Enter') hexValue.blur(); });

  // ---------- strips ----------

  const fills = {};
  const PX = { h: 1.5, s: 3, l: 3 };   // pixels of scroll per unit

  function wire(rowId, fillId, scrollId, key, input) {
    const row = document.getElementById(rowId);
    const fill = document.getElementById(fillId);
    const scroller = document.getElementById(scrollId);
    const ghost = scroller.querySelector('.ghost');
    const [min, max] = RANGES[key];
    const px = PX[key];
    fills[key] = fill;

    const clamp = v => Math.max(min, Math.min(max, v));

    // content is one row taller than the row, so scrollTop spans the range
    ghost.style.height = `calc(100% + ${(max - min) * px}px)`;

    const sync = () => { scroller.scrollTop = (active()[key] - min) * px; };
    syncs[key] = sync;

    let raf = null, settle = null;
    scroller.addEventListener('scroll', () => {
      if (!raf) {
        raf = requestAnimationFrame(() => {
          raf = null;
          setActive(key, clamp(min + scroller.scrollTop / px));
          render();
        });
      }
      clearTimeout(settle);
      settle = setTimeout(() => {
        const target = Math.round(scroller.scrollTop / px) * px;
        if (Math.abs(scroller.scrollTop - target) > 0.5) {
          scroller.scrollTo({ top: target, behavior: 'smooth' });
        }
      }, 90);
    });

    // Dragging sideways moves the value directly, at bar width = full range,
    // so the fill tracks the finger. Vertical stays with the native scroller,
    // which is where the momentum comes from.
    let downPos = 0, startX = 0, startY = 0, startVal = 0, sliding = false, held = false;

    scroller.addEventListener('pointerdown', e => {
      downPos = scroller.scrollTop;
      startX = e.clientX;
      startY = e.clientY;
      startVal = active()[key];
      sliding = false;
      held = true;
    });

    scroller.addEventListener('pointermove', e => {
      if (!held) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if (!sliding) {
        if (Math.abs(dx) < 4 || Math.abs(dx) <= Math.abs(dy)) return;
        sliding = true;
        try { scroller.setPointerCapture(e.pointerId); } catch (err) {}
        if (document.activeElement === input) input.blur();
      }
      const r = row.getBoundingClientRect();
      setActive(key, Math.round(clamp(startVal + dx / (r.width / (max - min)))));
      sync();
      render();
    });

    const endDrag = e => {
      if (!held) return;
      held = false;
      if (sliding) { try { scroller.releasePointerCapture(e.pointerId); } catch (err) {} }
    };

    scroller.addEventListener('pointerup', endDrag);
    scroller.addEventListener('pointercancel', endDrag);

    // a tap that neither scrolled nor slid jumps straight to that position
    scroller.addEventListener('click', e => {
      if (sliding) { sliding = false; return; }
      if (Math.abs(scroller.scrollTop - downPos) > 2) return;
      const r = row.getBoundingClientRect();
      const t = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
      setActive(key, Math.round(min + t * (max - min)));
      sync();
      render();
    });

    const commit = () => {
      const n = parseFloat(input.value);
      if (!isNaN(n)) { setActive(key, Math.round(clamp(n))); sync(); }
      render();
    };

    input.addEventListener('focus', () => input.select());
    input.addEventListener('change', commit);
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') input.blur(); });

    inputs[key] = input;
  }

  wire('rowH', 'fillH', 'scrollH', 'h', valH);
  wire('rowS', 'fillS', 'scrollS', 's', valS);
  wire('rowL', 'fillL', 'scrollL', 'l', valL);

  try {
    const saved = JSON.parse(localStorage.getItem('color.state') || 'null');
    if (saved && saved.bg && typeof saved.bg.h === 'number') S = saved;
  } catch (e) {}

  // one dot per pair of groups; only used at the mobile width
  (function pager() {
    const dots = document.getElementById('dots');
    const stops = [...rowsEl.querySelectorAll('.page')];
    if (stops.length < 2) return;

    const marks = stops.map((_, i) => {
      const d = document.createElement('span');
      d.className = 'dot' + (i ? '' : ' on');
      dots.appendChild(d);
      return d;
    });

    let raf = null;
    rowsEl.addEventListener('scroll', () => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        raf = null;
        const x = rowsEl.scrollLeft;
        let best = 0, gap = Infinity;
        stops.forEach((s, i) => {
          const d = Math.abs(s.offsetLeft - x);
          if (d < gap) { gap = d; best = i; }
        });
        marks.forEach((m, i) => m.classList.toggle('on', i === best));
      });
    });
  })();

  function syncAll() { syncs.h(); syncs.s(); syncs.l(); }

  modeBg.addEventListener('click', () => { S.target = 'bg'; syncAll(); render(); });
  modeText.addEventListener('click', () => { S.target = 'text'; syncAll(); render(); });
  modeInvert.addEventListener('click', () => { S.auto = true; syncAll(); render(); });

  modeSwap.addEventListener('click', () => {
    const t = textHSL();
    S.text = S.bg;
    S.bg = t;
    syncAll();
    render();
  });

  render();
  requestAnimationFrame(syncAll);
</script>

</body>
</html>
